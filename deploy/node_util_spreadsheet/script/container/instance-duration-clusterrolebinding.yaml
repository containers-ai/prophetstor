apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: instance-duration-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: instance-duration-role
subjects:
- kind: ServiceAccount
  name: instance-duration-sa
  namespace: default  # Replace 'default' with your namespace if different
